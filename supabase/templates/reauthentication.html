<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirm your identity on AWN</title>
</head>
<body style="margin:0;padding:0;background:#0a0a0b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <span style="display:none;max-height:0;overflow:hidden;">Confirm your identity on AWN</span>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0a0a0b;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#141416;border:1px solid #27272a;border-radius:16px;overflow:hidden;">
          <tr>
            <td align="left" style="padding:32px 28px 8px;">
              <img src="https://awrightnetwork.com/apple-touch-icon.png" alt="A Wright Network" width="56" height="56" style="display:block;border-radius:22%;" />
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 32px;color:#fafafa;">
              
    <h1 style="margin:0 0 12px;font-size:24px;font-weight:600;line-height:1.3;color:#fafafa;">
      Confirm it's you
    </h1>
    <p style="margin:0;font-size:15px;line-height:1.6;color:#d4d4d8;">For your security, enter the code below to continue with a sensitive account action.</p>
    <p style="margin:28px 0 0;">
  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#ffffff;color:#18181b;text-decoration:none;font-weight:600;font-size:14px;padding:12px 20px;border-radius:0.5rem;">
    Continue
  </a>
</p>
    <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#71717a;">Your verification code: <strong style="color:#fafafa;font-size:18px;letter-spacing:0.1em;">{{ .Token }}</strong></p>
  
            </td>
          </tr>
        </table>
        <p style="margin:24px 0 0;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;text-align:center;">
          <a href="https://awrightnetwork.com/" style="color:#a1a1aa;text-decoration:none;">A Wright Network</a>
        </p>
        <p style="margin:8px 0 0;font-size:12px;color:#71717a;text-align:center;">
          People. Community. Opportunity.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
